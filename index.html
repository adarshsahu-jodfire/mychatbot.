<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f8fafc;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid #263044;
      background: #11182a;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .brand span {
      color: #8b7cff;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: bold;
    }

    #newChat {
      color: white;
      background: #28334b;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 24px 16px;
    }

    #welcome {
      text-align: center;
      padding: 50px 10px 25px;
    }

    #welcome h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 12px;
    }

    #welcome p {
      color: #a7b2c8;
      line-height: 1.7;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 25px;
    }

    .message {
      max-width: 90%;
      padding: 15px 17px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #6757e8;
      color: white;
    }

    .assistant {
      align-self: flex-start;
      background: #182237;
      border: 1px solid #29354c;
    }

    #status {
      color: #a7b2c8;
      font-size: 14px;
      min-height: 22px;
      margin-bottom: 8px;
    }

    .composer {
      position: sticky;
      bottom: 10px;
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid #303b51;
      border-radius: 16px;
      background: #11182a;
      box-shadow: 0 10px 35px #0005;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      border: 0;
      outline: none;
      color: white;
      background: transparent;
      font: inherit;
      padding: 12px 5px;
    }

    #send {
      color: white;
      background: #7462ff;
      min-width: 80px;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      color: #8490a7;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 500px) {
      header {
        padding: 15px;
      }

      .brand {
        font-size: 18px;
      }

      .message {
        max-width: 96%;
      }

      #send {
        min-width: 65px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">✨ My <span>AI</span></div>
    <button id="newChat">＋ New Chat</button>
  </header>

  <main>
    <section id="welcome">
      <h1>What can I help you with?</h1>
      <p>
        नमस्ते! मैं तुम्हारा AI Assistant हूँ।<br>
        कोई भी सवाल पूछो और बातचीत शुरू करो।
      </p>
    </section>

    <section id="chat" aria-live="polite"></section>

    <div id="status" role="status"></div>

    <form class="composer" id="chatForm">
      <textarea
        id="prompt"
        placeholder="यहाँ अपना सवाल लिखें..."
        aria-label="अपना सवाल लिखें"
        maxlength="5000"
        required
      ></textarea>

      <button id="send" type="submit">Send ↑</button>
    </form>
  </main>

  <footer>
    AI can make mistakes. Please verify important information.
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const chatForm = document.getElementById("chatForm");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");
    const welcome = document.getElementById("welcome");
    const newChatButton = document.getElementById("newChat");

    let messages = [];
    let busy = false;

    function addMessage(role, content) {
      const bubble = document.createElement("div");
      bubble.className = "message " + role;

      // Display text safely; do not interpret AI output as HTML.
      bubble.textContent = content;

      chat.appendChild(bubble);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return bubble;
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;

      busy = true;
      sendButton.disabled = true;
      promptInput.disabled = true;
      status.textContent = "AI जवाब तैयार कर रहा है...";
      welcome.style.display = "none";

      messages.push({
        role: "user",
        content: text
      });

      addMessage("user", text);

      const loadingBubble = addMessage(
        "assistant",
        "⏳ जवाब लिखा जा रहा है..."
      );

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed."
          );
        }

        if (!data.reply) {
          throw new Error("AI se jawab nahi mila.");
        }

        loadingBubble.textContent = data.reply;

        messages.push({
          role: "assistant",
          content: data.reply
        });

      } catch (error) {
        loadingBubble.textContent =
          "⚠️ " + error.message;

        messages.pop();
        status.textContent =
          "कनेक्शन में समस्या हुई। दोबारा कोशिश करें।";

        busy = false;
        sendButton.disabled = false;
        promptInput.disabled = false;
        promptInput.focus();
        return;
      }

      status.textContent = "";
      busy = false;
      sendButton.disabled = false;
      promptInput.disabled = false;
      promptInput.focus();
    }

    chatForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = promptInput.value.trim();

      if (!text || busy) return;

      promptInput.value = "";
      sendMessage(text);
    });

    promptInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    newChatButton.addEventListener("click", () => {
      if (busy) return;

      messages = [];
      chat.replaceChildren();
      welcome.style.display = "block";
      status.textContent = "";
      promptInput.value = "";
      promptInput.focus();
    });
  </script>

</body>
</html>
